name: Fetch Latest Blog Posts

on:
  schedule:
    # Runs at 18:29 UTC every Sunday (11:59 PM IST)
    - cron: '29 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull RSS feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.blogs.ojasdeshpande.in/feed.xml"
          max_post_count: 4
          template: "$newline- [$title]($url) ($date)"
          date_format: "mmm d, yyyy"
